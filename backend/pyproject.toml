[project]
name = "inquira"
version = "1.0.0"
description = "Open-source AI analytics copilot: ask your data questions in plain language, get validated SQL, charts, and answers."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0.30",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "sqlglot>=25",
  "duckdb>=1.0",
  "httpx>=0.27",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "openai>=1.40",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",  # Postgres: the recommended metadata store (Neon, RDS, Supabase...)
  "redis>=5.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.10"]
all = ["pymysql>=1.1", "snowflake-connector-python>=3.10"]
dev = ["pytest>=8", "ruff>=0.5", "pgserver>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inquira"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
