# Developer config for creating revisions:  .venv/bin/alembic revision --autogenerate -m "describe change"
# Applying migrations in deployments:       python -m inquira migrate   (runs automatically at startup too)
[alembic]
script_location = inquira/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
